server {
    listen 8000;
    listen [::]:8000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json application/wasm image/svg+xml
               font/ttf font/otf;

    # Tipos MIME adicionales
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
        application/wasm wasm;
    }

    # Archivos que deben revalidarse siempre para que los usuarios
    # reciban la última versión desplegada.
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|recetarium_sw\.js|manifest\.json|version\.json|main\.dart\.js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Recursos estáticos (iconos, fuentes, imágenes, canvaskit)
    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|ttf|otf|woff2?|wasm)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Fallback SPA: cualquier ruta desconocida devuelve index.html
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
